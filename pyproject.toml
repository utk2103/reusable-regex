[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-regex"
version = "0.1.0"
description = "Regex + IOC extraction toolkit for security engineers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ioc-extract = "cli.extract_iocs:app"
log-scan = "cli.scan_logs:app"
secret-detect = "cli.detect_secrets:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["regex_patterns*", "utils*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
